x-backend: &backend
  build:
    context: ./backend
    args:
      INSTALL_DEV: "true"
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://docintel:docintel@db:5432/docintel
    REDIS_URL: redis://redis:6379/0
  volumes:
    - uploads:/data/uploads
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_started

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
      POSTGRES_DB: docintel
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7-alpine

  api:
    <<: *backend
    ports:
      - "8000:8000"

  worker:
    <<: *backend
    command: rq worker documents --url redis://redis:6379/0
    deploy:
      replicas: 2

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - api

  # Public HTTPS URL through a Cloudflare quick tunnel (random trycloudflare.com address).
  # Only starts with: docker compose --profile public up -d
  tunnel:
    image: cloudflare/cloudflared:2026.5.2
    profiles: [public]
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend

volumes:
  pgdata:
  uploads:
