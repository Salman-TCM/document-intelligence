# Single entry point: serves the React build and proxies the API and its docs.
# Behind a Cloudflare tunnel, the real client IP arrives in CF-Connecting-IP.
map $http_cf_connecting_ip $client_ip {
  ""      $remote_addr;
  default $http_cf_connecting_ip;
}

# Uploads (POST) get a tighter limit than reads; an empty key means "not limited".
map $request_method $upload_key {
  POST    $client_ip;
  default "";
}

limit_req_zone $client_ip zone=api:10m rate=10r/s;
limit_req_zone $upload_key zone=uploads:10m rate=10r/m;

server {
  listen 80;
  client_max_body_size 200m;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  # Use Docker's DNS and a variable so nginx looks the api up again after it restarts,
  # instead of caching the old container IP.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:8000;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $client_ip;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  limit_req_status 429;

  location /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_req zone=uploads burst=5 nodelay;
    proxy_pass $api;
    proxy_request_buffering off;  # stream large uploads straight to the API
    proxy_read_timeout 300s;
  }

  location ~ ^/(docs|redoc|openapi\.json)$ {
    proxy_pass $api;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
