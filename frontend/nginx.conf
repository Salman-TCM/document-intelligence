server {
  listen 80;
  client_max_body_size 200m;

  # Use Docker's DNS and a variable so nginx looks the api up again after it restarts,
  # instead of caching the old container IP.
  resolver 127.0.0.11 valid=10s;
  set $api http://api:8000;

  location /api/ {
    proxy_pass $api;
    proxy_read_timeout 300s;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
